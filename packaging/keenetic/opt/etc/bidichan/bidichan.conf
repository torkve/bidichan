# bidichan peer config for Keenetic (Entware).
#
# Edit this file over the console (telnet/ssh into the router, then):
#     vi /opt/etc/bidichan/bidichan.conf
# and apply changes with:
#     /opt/etc/init.d/S60bidichan restart
#
# The service subcommand (connect vs listen) is set separately, at the top
# of /opt/etc/init.d/S60bidichan (the MODE line).
#
# Keep this file owner-readable only when it holds a PSK inline:
#     chmod 600 /opt/etc/bidichan/bidichan.conf

# --- transport endpoint (pick exactly one of addr / unix-socket) ---

# Server to dial (connect mode) or address to bind (listen mode).
addr           = cdn.example.com:443

# --- identity ---

# SNI hostname. Must match what the other end expects.
hostname       = cdn.example.com

# Pre-shared key (hex), kept in a sibling file so the secret is not
# inlined here. This file is generated automatically on install and on
# first start, mode 600 — you do not need to create it. Print it with:
#     cat /opt/etc/bidichan/psk.hex
# and set THE SAME value on the other peer; the two must match.
# To roll it: rm the file, then `S60bidichan genpsk && S60bidichan restart`.
psk-file       = ./psk.hex
# Setting `psk` inline instead disables the automatic generation above.
# psk          = <64 hex chars>

# --- shared ---

# WebSocket path. Both ends must agree; unset derives it from the PSK.
# path         = /ws

# --- client-only (connect mode) ---

# Set when the server sits behind a TLS-terminating reverse proxy.
# no-tls-binding = true

# Channels to open automatically once connected. Repeatable; same syntax
# as `bidichan channel open`. This is usually why a router runs bidichan:
# expose a LAN service outward, or pull a remote service onto the LAN.
# channel      = forward -R 2222:192.168.1.1:22
# channel      = socks5 --listen 0.0.0.0:1080

# --- running on a small box ---
# Keenetic Ultra shares ~256 MiB with the firmware; keep bidichan modest.
memory-limit   = 48
resume-buffer  = 512k
stream-window  = 256k
