name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel in-flight runs when a newer commit lands on the same ref. Saves
# minutes when force-pushing through a PR.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + vet + race tests
    runs-on: ubuntu-latest
    # The race test suite finishes in ~3s, but TestNginxDockerFront pulls
    # nginx:alpine on a cold runner. Five minutes is roomy.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # '1.26' resolves to the latest 1.26.x patch, which is what we
          # want — pinning a patch would silently miss stdlib CVEs. The major
          # is a floor, not a preference: see the Build section of the README.
          go-version: '1.26'
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: build the mobile bindings
        # Every file in ./mobile that does anything is behind an ios and/or
        # android build tag — only doc.go, which is `!ios && !android`, is what
        # the untagged build, vet and test steps above compile. So none of the
        # implementation is checked up there. That matters most for the types
        # it mirrors from internal packages: a field renamed or removed in the
        # core leaves everything above green and breaks only the gomobile
        # build, on the clients' CI. These steps are cheap and close that gap.
        #
        # No -tags: GOOS=ios and GOOS=android are what `//go:build ios ||
        # android` keys on. CGO stays off — this is a compile check, not a
        # bind, and there is no cross C toolchain on the runner.
        #
        # 32-bit as well as 64-bit, because `gomobile bind -target=android`
        # passes no ABI list and so builds arm and 386 too. An int that only
        # overflows on a 32-bit word would otherwise be found on the client's
        # CI, which is the failure this step exists to prevent.
        run: |
          GOOS=ios GOARCH=arm64 CGO_ENABLED=0 go build ./mobile/
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./mobile/
          GOOS=android GOARCH=arm CGO_ENABLED=0 go build ./mobile/

      - name: vet the mobile bindings
        # Android only: vet links a test binary, and GOOS=ios cannot do that
        # without cgo, which needs a C toolchain we do not have here. Between
        # this and the untagged vet above, which covers doc.go, the only file
        # in the package left unvetted anywhere is the iOS-only tun.go.
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go vet ./mobile/

      - name: Pre-pull nginx:alpine
        # TestNginxDockerFront launches a container — pulling the image
        # inline would land in the test's slow path and could race with
        # waitForPort. Pull it once up-front so the test sees a warm cache.
        run: docker pull nginx:alpine

      - name: go test -race
        # -v so failing subtests print their progress messages directly to
        # the workflow log (the only way we get to read them without a
        # token capable of fetching raw job logs).
        run: go test -race -v -timeout 5m ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Report-only: a finding here doesn't fail the build (Dependabot
        # already opens PRs for actionable items). Use `continue-on-error`
        # so the step is visible in the run summary but a vuln in stdlib
        # or an unreachable transitive dep doesn't block the workflow.
        continue-on-error: true
        run: $(go env GOPATH)/bin/govulncheck ./...
